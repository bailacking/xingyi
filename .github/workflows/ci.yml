name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建内部包
        run: npm run build:packages

      - name: 类型检查
        run: npm run typecheck

      - name: 单测
        run: npm test

      - name: 构建产物
        run: npm run build
